name: TikTok Auto Bot

on:
  schedule:
    # Tự động kích hoạt vào mỗi tiếng (cron trong UTC time)
    - cron: '0 * * * *'
  # Cho phép bấm nút kích hoạt thủ công trên GitHub
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cài đặt Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt Thư viện & Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install google-genai playwright
          playwright install chromium --with-deps

      - name: Chạy Tool TikTok
        run: python tool.py
        
